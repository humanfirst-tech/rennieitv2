name: Update latest CISA KEV

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-kev:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Download CISA KEV catalog
        run: |
          curl --fail --location --retry 3 \
            --user-agent "Mozilla/5.0 RennieIT-KEV-Updater/1.0" \
            --output /tmp/kev.json \
            "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"

      - name: Write latest KEV for website
        shell: python
        run: |
          import json
          from pathlib import Path

          source = json.loads(Path('/tmp/kev.json').read_text())
          vulns = source.get('vulnerabilities', [])
          if not vulns:
              raise SystemExit('CISA KEV catalog returned no vulnerabilities')

          latest = max(vulns, key=lambda item: item.get('dateAdded', ''))
          cve = latest.get('cveID', '')
          output = {
              'cveID': cve,
              'vendorProject': latest.get('vendorProject', ''),
              'product': latest.get('product', ''),
              'dateAdded': latest.get('dateAdded', ''),
              'cisaUrl': f'https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search_api_fulltext={cve}'
          }
          Path('kev-latest.json').write_text(json.dumps(output, indent=2) + '\n')

      - name: Commit if KEV changed
        run: |
          if git diff --quiet -- kev-latest.json; then
            echo "No KEV change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kev-latest.json
          git commit -m "Update latest CISA KEV"
          git push
